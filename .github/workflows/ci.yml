name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Pemeriksaan kualitas web
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang dependensi
        run: npm ci --no-audit --no-fund
      - name: Format sementara dan simpan perubahan Fase 7
        if: github.event_name == 'pull_request' && github.head_ref == 'phase-7-admin-analytics-localization'
        run: |
          npx prettier --write "src/**/*.{ts,tsx,css}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "style(phase-7): apply Prettier formatting"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Periksa format
        run: npm run format:check
      - name: Periksa lint
        run: npm run lint
      - name: Periksa tipe
        run: npm run typecheck
      - name: Jalankan pengujian unit
        run: npm run test:run
      - name: Build production
        run: npm run build

  database:
    name: Pengujian migrasi dan RLS Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4
      - name: Siapkan Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Periksa perintah CLI
        run: |
          supabase --help
          supabase migration --help
          supabase db --help
      - name: Jalankan basis data lokal
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,inbucket
      - name: Terapkan seluruh migrasi
        run: supabase db reset
      - name: Periksa basis data
        run: supabase db lint --local --fail-on error
      - name: Jalankan pengujian basis data
        run: supabase test db
