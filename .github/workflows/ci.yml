name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Pemeriksaan kualitas web
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang dependensi
        run: npm ci --no-audit --no-fund
      - name: Periksa format
        run: npm run format:check
      - name: Periksa lint
        run: npm run lint
      - name: Periksa tipe
        run: npm run typecheck
      - name: Jalankan pengujian unit
        run: npm run test:run
      - name: Build production
        run: npm run build

  database:
    name: Pengujian migrasi dan RLS Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4
      - name: Siapkan Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Periksa perintah CLI
        run: |
          supabase --help
          supabase migration --help
          supabase db --help
      - name: Validasi konfigurasi Supabase
        run: supabase config validate
      - name: Jalankan basis data lokal
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Terapkan seluruh migrasi
        run: supabase db reset
      - name: Periksa basis data
        run: supabase db lint --local --fail-on error
      - name: Jalankan pengujian basis data
        run: supabase test db

  production:
    name: Deployment Vercel production
    needs: [web, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy production
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        run: |
          npm install --global vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
