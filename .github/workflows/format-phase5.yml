name: Pemformat Fase 5 (sementara)

on:
  push:
    branches: [feat/phase-5-guest-operations]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-5-guest-operations
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write "src/**/*.{ts,tsx,css}"
      - name: Simpan hasil format
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style: format implementasi fase 5"
            git push origin HEAD:feat/phase-5-guest-operations
          fi
