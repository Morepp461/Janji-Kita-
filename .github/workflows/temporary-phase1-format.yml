name: Temporary Phase 1 Formatter

on:
  push:
    branches:
      - feat/phase-1-identity-admin

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pasang dependensi
        run: npm ci --no-audit --no-fund
      - name: Format kode
        run: npm run format
      - name: Simpan hasil format sementara
        run: |
          if [[ -n "$(git status --porcelain src)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style: format implementasi fase 1"
            git push
          fi
